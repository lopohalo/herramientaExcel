name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.20.8
          cache: npm
      # El proyecto Angular 15 conserva dependencias antiguas que npm estricto
      # intenta resolver nuevamente. El lockfile se respeta, pero se toleran
      # sus peer dependencies históricas durante la instalación del runner.
      - run: npm install --legacy-peer-deps
      - run: npm run build -- --base-href /herramientaExcel/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/herramienta-excel

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
