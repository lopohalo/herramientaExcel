[build]
  command = "npm run build"
  publish = "dist/herramienta-excel"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/dnp-api/*"
  to = "/.netlify/functions/dnp-proxy/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
