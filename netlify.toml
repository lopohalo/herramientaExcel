[build]
  command = "npm run build"
  publish = "dist/herramienta-excel"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20.18.1"
  NPM_VERSION = "9.9.4"

[[redirects]]
  from = "/dnp-api/*"
  to = "/.netlify/functions/dnp-proxy/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
